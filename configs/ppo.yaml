# PPO settings shared by all runs. CleanRL's ppo_continuous_action defaults,
# with fewer epochs/minibatches to keep each update cheap.
num_envs: 64
num_steps: 64
total_timesteps: 2000000
lr: 0.0003
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
update_epochs: 4
num_minibatches: 8
clip_eps: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
hidden: 256
log_std_init: -1.6
reward_scale: 0.1
